name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - README*.md
      - CHANGELOG*.md
      - CONTRIBUTING*.md
      - benchmarks/README*.md
      - tools/check_documentation.py
      - tests/documentation_navigation.cjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Prepare static documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check authored documentation and language navigation
        run: |
          python3 tools/check_documentation.py
          node tests/documentation_navigation.cjs
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
