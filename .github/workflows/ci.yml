name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist
      - run: composer check
      - run: php examples/basic.php
      - run: php examples/monolog.php

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer update --no-dev --no-interaction --prefer-dist
      - name: Verify production package dependencies
        run: |
          php -r '$packages = array_column(json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR)["packages"], "name"); sort($packages); if ($packages !== ["psr/log"]) { fwrite(STDERR, "Unexpected production packages: ".implode(", ", $packages).PHP_EOL); exit(1); }'
      - run: php examples/basic.php
